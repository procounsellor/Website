name: Deploy React App to Cloudflare Pages

on:
  push:
    branches:
      - main 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # pnpm before Node: setup-node's `cache: 'pnpm'` needs the pnpm binary on
      # PATH to locate the store. Version comes from package.json's
      # `packageManager` field, so CI and every developer install identically.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # --frozen-lockfile is the CI equivalent of `npm ci`: it refuses to update
      # pnpm-lock.yaml, so a package.json edit committed without a matching
      # lockfile fails here rather than silently resolving to something new.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application (Runs react-snap)
        run: pnpm run build
        env:
          CI: false
          # API Base URLs
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_CHATBOT_API_URL: ${{ secrets.VITE_CHATBOT_API_URL }}
          VITE_COLLEGE_SEARCH_API_URL: ${{ secrets.VITE_COLLEGE_SEARCH_API_URL }}
          VITE_NEET_COUNSELLING_API_URL: ${{ secrets.VITE_NEET_COUNSELLING_API_URL }}
          
          # Firebase Configuration
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      # wrangler-action is deliberately not used here. It installs wrangler with
      # `pnpm add` inside this repo, and since pnpm 10 that aborts with
      # ERR_PNPM_IGNORED_BUILDS because wrangler pulls in sharp and workerd,
      # neither of which is answered in pnpm-workspace.yaml's allowBuilds.
      # `pnpm dlx` runs wrangler from a temp store instead, so the deploy never
      # touches package.json, the lockfile, or the build-script policy.
      # Both secrets are trimmed before wrangler builds a URL and an auth header
      # out of them: a run failed with `/accounts/*** /pages/...`, and that space
      # after the masked id was a stray character in the secret itself, which
      # Cloudflare answers with 7003 "perhaps your object identifier is invalid".
      # The preflight only reports — a token scoped oddly could fail to list
      # projects and still deploy, so it never blocks the deploy step.
      - name: Deploy to Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]')"

          echo "account id: ${#CLOUDFLARE_ACCOUNT_ID} chars after trimming (expected 32)"
          status=$(curl -sS -o /tmp/cf-projects.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          if [ "$status" = "200" ]; then
            echo "Pages projects this token can see:"
            node -e "JSON.parse(require('fs').readFileSync('/tmp/cf-projects.json','utf8')).result.forEach(p => console.log(' -', p.name))"
          else
            echo "Pages project list returned HTTP $status - if the deploy below fails too, the"
            echo "account id or the token's Account > Cloudflare Pages > Edit permission is the cause:"
            head -c 600 /tmp/cf-projects.json
            echo
          fi

          pnpm dlx wrangler@3.114.17 pages deploy dist --project-name=website --commit-dirty=true
